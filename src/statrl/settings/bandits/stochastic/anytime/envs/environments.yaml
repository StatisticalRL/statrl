
bernoulli_simple:
  entrypoint: "parametric:BernoulliBandit"
  displayname: "Bernoulli Simple"
  kwargs:
    means: [0.2, 0.8, 0.7, 0.5]

bernoulli_hard:
  entrypoint: "parametric:BernoulliBandit"
  displayname: "Bernoulli Hard"
  kwargs:
    means: [ 0.7, 0.7, 0.701, 0.7 ]

binomial_simple:
  entrypoint: "parametric:BinomialBandit"
  displayname: "Binomial ($200$)"
  kwargs:
    means: [0.2, 0.8, 0.7, 0.5]
    repetitions: 200

gaussian_simple:
  entrypoint: "parametric:GaussianBandit"
  displayname: "Gaussian ($var=0.05$)"
  kwargs:
    means: [0.2, 0.8, 0.7, 0.5]
    vars: [0.05, 0.05, 0.05, 0.05]

truncated_gaussian:
  entrypoint: "parametric:TruncatedGaussianBandit"
  displayname: "Truncated Gaussian in $[-1,1]$ ($sigma=0.5$)"
  kwargs:
    means: [0.2, 0.8, 0.7, 0.5]

bernoulli_random:
  entrypoint: "parametric:RandomBernoulliBandit"
  displayname: "Bernoulli Random ($5$ arms, Gap$=0.2$)"
  kwargs:
    Delta: 0.2
    K: 5